[versions]
# --- Build toolchain (see docs/TECH_STACK.md) -------------------------------------------
agp = "9.3.3"
kotlin = "2.4.21"

# --- Android platform -------------------------------------------------------------------
# compileSdk is 37 (not the 36 baseline): the resolved library versions require compiling
# against API 37. See docs/TECH_STACK.md §5.1 for the exact build error.
# Android 17 (API 37) is published as a *minor-versioned* platform - Google ships
# `platforms;android-37.0`, not `platforms;android-37` - so the minor version must be declared
# as well, otherwise AGP looks for a target that does not exist. See docs/TECH_STACK.md §5.2.
compileSdk = "37"
compileSdkMinor = "0"
targetSdk = "36"
minSdk = "26"

# --- Libraries --------------------------------------------------------------------------
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
datastore = "1.2.1"
koin = "4.2.2"
coroutines = "1.11.0"
junit = "4.13.2"

# --- Prayer calculation engine ----------------------------------------------------------
# Adhan Kotlin (batoulapps/adhan-kotlin), published as `com.batoulapps.adhan:adhan2`.
#
# Pinned to 0.0.5 deliberately. 0.0.6 and 0.0.7 are compiled for a JVM target of 21, so their
# class files are version 65 and cannot be loaded by the JDK 17 toolchain this project builds,
# tests and lints with (reproduced: `UnsupportedClassVersionError: ... class file version 65.0,
# this version of the Java Runtime only recognizes class file versions up to 61.0`). 0.0.5 is
# the newest release published for JVM 17. See docs/PRAYER_CALCULATION.md section 1.
adhan = "0.0.5"

# --- Map picker -------------------------------------------------------------------------
# MapLibre Native for Android. Chosen over the Google Maps SDK because it needs no API key for
# rendering, works with OpenStreetMap-derived data (good South Asian coverage including smaller
# populated places) and keeps the recurring cost of a map at zero; see docs/MAP_PICKER.md for the
# full comparison, the tile and geocoding providers, and their terms.
#
# 13.5.3 is deliberately unchanged by the Android 16 renderer fix recorded at `maplibre-android-sdk`
# below. MapLibre publishes 13.6.x, but nothing in 13.6.0 or 13.6.1 fixes the Vulkan renderer crash, so
# moving the version would be an arbitrary change that addresses nothing; 13.7 is published as a
# pre-release and is not used.
maplibre = "13.5.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Compose libraries are versioned by the BOM.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Local astronomical prayer-time calculation. Works entirely offline; no network is involved.
adhan-kotlin = { group = "com.batoulapps.adhan", name = "adhan2", version.ref = "adhan" }

# Map rendering for the location picker. Tiles are fetched from a style URL (a Gradle property, with a
# key-free default); the coordinates and their validation stay offline.
#
# The **OpenGL ES** artifact, not `org.maplibre.gl:android-sdk`. Since MapLibre Android 13.0.0 the
# plain `android-sdk` artifact is Vulkan-only, and that Vulkan renderer hits a native SIGSEGV in
# `mln::android::MapRenderer::render()`, on the `MapLibreVulkanSurfaceView$VulkanThread` draw path, on
# Android 16. It is reported upstream as maplibre/maplibre-native#4274 — same function, same thread,
# Android 16 only, stable on Android 8–15 — and was closed unimplemented, so there is no version to
# upgrade to that fixes it. The `-opengl` artifact is the stable, widest-compatibility build of the
# same SDK release, and it removes the whole Vulkan path: `MapLibreVulkanSurfaceView` is compiled only
# into the Vulkan and multiBackend flavors, so it is not in this APK at all. Switching the artifact
# (rather than the version) is the fix; see docs/MAP_PICKER.md §2.1.
maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk-opengl", version.ref = "maplibre" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
