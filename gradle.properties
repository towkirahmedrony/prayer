# Gradle
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# Optimized R8 resource shrinking requires non-final R IDs
# (run 42373597056: "Optimized resource shrinking requires non-final IDs").
# No Kotlin code switches on R constants, so this is safe.
android.nonFinalResIds=true
