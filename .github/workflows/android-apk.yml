name: Salah Android APK

# Builds the Salah debug APK on GitHub-hosted runners. The APK is never built locally:
# this workflow is the authoritative build environment.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Minimal permissions: read the checked-out code and upload the APK artifact only.
permissions:
  contents: read

# One build per commit; a newer push supersedes an in-flight one.
concurrency:
  group: salah-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact commit being built
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (caching and wrapper validation)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install the required Android SDK packages
        # The runner image ships the Android SDK; compileSdk 37 and its build tools are
        # installed explicitly so the build never depends on whatever the image happens to ship.
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set on this runner" >&2
            exit 1
          fi
          SDKMANAGER=""
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          # Android 17 (API 37) is a minor-versioned platform: the package is
          # `platforms;android-37.0`, and `platforms;android-37` does not exist. AGP resolves it
          # through `compileSdk = 37` + `compileSdkMinor = 0` (app/build.gradle.kts).
          PACKAGES=(
            "platform-tools"
            "platforms;android-37.0"
            "build-tools;36.0.0"
            "build-tools;37.0.0"
          )
          if ! "$SDKMANAGER" --install "${PACKAGES[@]}"; then
            # Fall back to the canary channel if the stable index of the runner image is stale.
            echo "Default channel did not resolve every package; retrying on channel 3" >&2
            "$SDKMANAGER" --channel=3 --install "${PACKAGES[@]}"
          fi
          echo "Installed SDK platforms:"
          ls -1 "$ANDROID_HOME/platforms"

      - name: Validate the Gradle wrapper
        run: |
          set -euo pipefail
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version --no-daemon | tee gradle-version.txt
          if ! grep -q "Gradle 9.8.1" gradle-version.txt; then
            echo "Unexpected Gradle version reported by the wrapper:" >&2
            cat gradle-version.txt >&2
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace --info --console=plain

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug --stacktrace --console=plain

      - name: Build the debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace --console=plain

      - name: Verify the APK exists and is not empty
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "Expected APK not found: $APK" >&2
            echo "Available outputs:" >&2
            find app/build/outputs -type f >&2 || true
            exit 1
          fi
          SIZE="$(wc -c < "$APK")"
          echo "APK: $APK ($SIZE bytes)"
          if [ "$SIZE" -le 0 ]; then
            echo "APK is empty" >&2
            exit 1
          fi

      - name: Upload the Salah debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: salah-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish the build summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Salah debug APK"
            echo ""
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Run: $RUN_URL"
            echo "- Artifact: \`salah-debug-apk\` (14 day retention)"
          } >> "$GITHUB_STEP_SUMMARY"
