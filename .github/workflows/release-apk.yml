name: Salah Release APK

# Builds the Salah production-signed release APK on GitHub-hosted runners.
# The APK is never built locally: this workflow is the authoritative build
# environment. It replaces the former debug-APK workflow so only one APK
# build workflow exists in the repository.
# Triggered by a manual run or by pushing a version tag (v*). A tag push
# additionally creates a GitHub Release with the APK attached.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Release creation needs contents: write. Nothing else is granted.
permissions:
  contents: write

# One build per ref; a newer run supersedes an in-flight one.
concurrency:
  group: salah-release-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the exact commit being built
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (caching and wrapper validation)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install the required Android SDK packages
        # The runner image ships the Android SDK; compileSdk 37 and its build tools are
        # installed explicitly so the build never depends on whatever the image happens to ship.
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set on this runner" >&2
            exit 1
          fi
          SDKMANAGER=""
          for candidate in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          # Android 17 (API 37) is a minor-versioned platform: the package is
          # `platforms;android-37.0`, and `platforms;android-37` does not exist. AGP resolves it
          # through `compileSdk = 37` + `compileSdkMinor = 0` (app/build.gradle.kts).
          PACKAGES=(
            "platform-tools"
            "platforms;android-37.0"
            "build-tools;36.0.0"
            "build-tools;37.0.0"
          )
          if ! "$SDKMANAGER" --install "${PACKAGES[@]}"; then
            # Fall back to the canary channel if the stable index of the runner image is stale.
            echo "Default channel did not resolve every package; retrying on channel 3" >&2
            "$SDKMANAGER" --channel=3 --install "${PACKAGES[@]}"
          fi
          echo "Installed SDK platforms:"
          ls -1 "$ANDROID_HOME/platforms"

      - name: Validate the Gradle wrapper
        run: |
          set -euo pipefail
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version --no-daemon | tee gradle-version.txt
          if ! grep -q "Gradle 9.8.1" gradle-version.txt; then
            echo "Unexpected Gradle version reported by the wrapper:" >&2
            cat gradle-version.txt >&2
            exit 1
          fi

      - name: Determine release version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          GRADLE_VERSION="$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="$TAG"
            TAG_VERSION="$(printf '%s' "$TAG" | sed 's/^v//')"
            if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
              echo "::warning::Tag $TAG does not match versionName $GRADLE_VERSION in app/build.gradle.kts; the APK filename uses the tag, but the tag should match versionName."
            fi
          else
            VERSION="v$GRADLE_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_filename=Salah-${VERSION}-release.apk" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (versionName $GRADLE_VERSION)"

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace --info --console=plain

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug --stacktrace --console=plain

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          umask 077
          KEYSTORE="$RUNNER_TEMP/salah-release.jks"
          # Tolerate secrets stored with line wraps, spaces or URL-safe
          # alphabet (GitHub secrets are often pasted with wrapping). Strip
          # whitespace and translate URL-safe chars before decoding.
          CLEANED="$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | tr -- '-_' '+/')"
          # Restore missing padding if the secret was stored without it.
          while [ $(( ${#CLEANED} % 4 )) -ne 0 ]; do
            CLEANED="${CLEANED}="
          done
          printf '%s' "$CLEANED" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          if [ ! -s "$KEYSTORE" ]; then
            echo "Decoded keystore is empty" >&2
            exit 1
          fi
          echo "KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Keystore decoded ($(wc -c < "$KEYSTORE") bytes) to $KEYSTORE"

      - name: Build the signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_FILE:-}" ]; then
            echo "KEYSTORE_FILE is not set; keystore decode step must run first" >&2
            exit 1
          fi
          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "Release signing secrets KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD must all be set" >&2
            exit 1
          fi
          ./gradlew --no-daemon assembleRelease --stacktrace --console=plain

      - name: Verify, rename and checksum the signed APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK_FILENAME: ${{ steps.version.outputs.apk_filename }}
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "Expected APK not found: $SRC" >&2
            echo "Available outputs:" >&2
            find app/build/outputs -type f >&2 || true
            exit 1
          fi
          SIZE="$(wc -c < "$SRC")"
          echo "APK: $SRC ($SIZE bytes)"
          if [ "$SIZE" -le 0 ]; then
            echo "APK is empty" >&2
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found at $APKSIGNER" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$SRC"
          FINAL_APK="$APK_FILENAME"
          mv "$SRC" "$FINAL_APK"
          "$APKSIGNER" verify --verbose "$FINAL_APK"
          AAPT2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          if [ -x "$AAPT2" ]; then
            "$AAPT2" dump badging "$FINAL_APK" | grep -E "^package=|^sdkVersion:|^targetSdkVersion:" || true
            BADGING="$("$AAPT2" dump badging "$FINAL_APK" | grep "^package=" || true)"
          elif [ -x "$AAPT" ]; then
            "$AAPT" dump badging "$FINAL_APK" | grep -E "package=|sdkVersion|targetSdkVersion" || true
            BADGING="$("$AAPT" dump badging "$FINAL_APK" | grep "package=" || true)"
          else
            echo "Neither aapt2 nor aapt found under build-tools/37.0.0" >&2
            BADGING=""
          fi
          if [ -n "$BADGING" ] && ! printf '%s' "$BADGING" | grep -q "io.github.towkirahmedrony.salah"; then
            echo "APK package does not match expected applicationId io.github.towkirahmedrony.salah:" >&2
            echo "$BADGING" >&2
            exit 1
          fi
          sha256sum "$FINAL_APK" > "$FINAL_APK.sha256"
          echo "Renamed to $FINAL_APK"
          cat "$FINAL_APK.sha256"
          echo "final_apk=$FINAL_APK" >> "$GITHUB_OUTPUT"

      - name: Upload the Salah release APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Salah-${{ steps.version.outputs.version }}-release
          path: ${{ steps.version.outputs.apk_filename }}
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release for the version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          APK_FILENAME: ${{ steps.version.outputs.apk_filename }}
        run: |
          set -euo pipefail
          if [ ! -f "$APK_FILENAME" ]; then
            echo "APK not found for release: $APK_FILENAME" >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$APK_FILENAME" "$APK_FILENAME.sha256" --clobber
          else
            gh release create "$VERSION" "$APK_FILENAME" "$APK_FILENAME.sha256" --title "Salah $VERSION" --generate-notes
          fi
          echo "GitHub Release $VERSION created or updated with $APK_FILENAME"

      - name: Remove the temporary keystore
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/salah-release.jks"
          echo "Temporary keystore removed"

      - name: Publish the build summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          APK_FILENAME: ${{ steps.version.outputs.apk_filename }}
        run: |
          {
            echo "## Salah release APK"
            echo ""
            echo "- Version: \`$VERSION\`"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Run: $RUN_URL"
            echo "- Artifact: \`Salah-\${VERSION}-release\` (90 day retention)"
            echo "- File: \`$APK_FILENAME\`"
          } >> "$GITHUB_STEP_SUMMARY"
